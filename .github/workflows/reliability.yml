name: Sustained reliability

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      sink_ref:
        description: Sink tag or commit to qualify
        required: true
        default: main
  workflow_call:
    inputs:
      suite_ref:
        description: Immutable qualification suite commit
        required: true
        type: string
      sink_ref:
        description: Sink tag or commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sustained-reliability-${{ inputs.sink_ref || 'main' }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liran/sink-production-suite
          path: suite
          ref: ${{ inputs.suite_ref || github.sha }}
      - name: Check out Sink candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liran/sink
          path: sink-server
          ref: ${{ inputs.sink_ref || 'main' }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: suite/go.mod
          cache-dependency-path: suite/go.sum
      - name: Run two-hour fault qualification
        env:
          TMPDIR: ${{ runner.temp }}
          SINK_SERVER_DIR: ${{ github.workspace }}/sink-server
        run: make -C suite test-reliability
      - name: Upload fault and resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reliability-evidence
          path: ${{ runner.temp }}/sink-qualification.*
          retention-days: 14
