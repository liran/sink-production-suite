name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Contract, race, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race tests
        run: make test-race

      - name: Run lint
        run: make lint

  production:
    name: Public backend qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Sink server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liran/sink
          path: sink-server
          ref: main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run production qualification
        env:
          SINK_SERVER_DIR: ${{ github.workspace }}/sink-server
        run: make test-production

  fuzz:
    name: Stateful model fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz Product and Offer state machines
        env:
          FUZZ_TIME: 1m
        run: make fuzz
