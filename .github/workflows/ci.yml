name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-gate:
    name: Suite reliability gate
    if: always()
    needs: [resolve-server, test, production, sensitivity, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | length > 0 and all(.[]; .value.result == "success")' <<< "$RESULTS"

  resolve-server:
    name: Resolve Sink candidate
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Resolve matching server branch or main to an immutable commit
        id: resolve
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          remote=https://github.com/liran/sink.git
          revision=$(git ls-remote --heads "$remote" "refs/heads/$CANDIDATE_REF" | awk '{print $1}')
          if [[ -z "$revision" ]]; then
            revision=$(git ls-remote --exit-code --heads "$remote" refs/heads/main | awk '{print $1}')
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Sink candidate: $revision"

  test:
    name: Contract, race, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race tests
        run: make test-race

      - name: Run lint
        run: make lint

  production:
    name: Public backend qualification
    needs: resolve-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Sink server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liran/sink
          path: sink-server
          ref: ${{ needs.resolve-server.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run production qualification
        env:
          SINK_SERVER_DIR: ${{ github.workspace }}/sink-server
          TMPDIR: ${{ runner.temp }}
        run: make test-production

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-evidence
          path: |
            ${{ runner.temp }}/sink-qualification.*
            ${{ runner.temp }}/sink-conformance.*
          retention-days: 14

  sensitivity:
    name: Historical regression sensitivity
    needs: resolve-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Sink history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liran/sink
          path: sink-server
          ref: ${{ needs.resolve-server.outputs.revision }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prove current pass and historical assertion failures
        env:
          SINK_SERVER_DIR: ${{ github.workspace }}/sink-server
          TMPDIR: ${{ runner.temp }}
        run: make test-regression-sensitivity
      - name: Upload current and historical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-sensitivity-evidence
          path: ${{ runner.temp }}/sink-conformance.*
          retention-days: 14

  fuzz:
    name: Stateful model fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz Product and Offer state machines
        shell: bash
        env:
          FUZZ_TIME: 30s
        run: make fuzz 2>&1 | tee "${{ runner.temp }}/stateful-fuzz.log"
      - name: Upload fuzz results and failure corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stateful-fuzz-evidence
          path: |
            ${{ runner.temp }}/stateful-fuzz.log
            contract/testdata/fuzz
          retention-days: 14
